<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jake Steffen · Software Developer</title>
    <meta name="description" content="Jake Steffen is a software developer working in C#, .NET, Angular, Blazor and SQL Server. This portfolio is a small desktop you can click around in." />
    <meta property="og:title" content="Jake Steffen · Software Developer" />
    <meta property="og:description" content="A portfolio you can click around in: resume, projects and live apps on a tiny desktop built with Blazor." />
    <meta property="og:type" content="website" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
        // Set the theme before anything paints so there is no flash.
        (() => {
            let theme = null;
            try { theme = localStorage.getItem('jakeos.theme'); } catch { }
            if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Shown while the .NET runtime downloads. Blazor replaces it when the desktop is ready. -->
        <main class="boot">
            <div class="boot-card">
                <p class="boot-os">jakeOS</p>
                <h1>Jake Steffen</h1>
                <p class="boot-role">Software Developer · C# / .NET · Angular · Blazor · SQL Server</p>
                <div class="boot-bar" role="progressbar" aria-label="Starting the desktop"><span></span></div>
                <p class="boot-status">Starting the desktop<span class="boot-pct"></span></p>
                <p class="boot-links">
                    In a hurry?
                    <a href="mailto:jsteffen182@gmail.com">Email me</a>
                    <a href="https://github.com/LegoLife">GitHub</a>
                </p>
                <noscript>
                    <p>This portfolio is an interactive desktop and needs JavaScript. You can still reach me at
                        jsteffen182@gmail.com or see my code at github.com/LegoLife.</p>
                </noscript>
            </div>
        </main>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/desktop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
